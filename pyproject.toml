[project]
name = "buildscore"
version = "0.1.0"
description = "Measure how effectively a developer turns ideas into shipped software."
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "openai>=1.50",
]

[project.scripts]
buildscore = "buildscore.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
